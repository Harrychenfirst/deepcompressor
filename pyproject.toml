[tool.poetry]
name = "deepcompressor-toolkit"
version = "0.0.4"
description = "This package is model compression toolkit for large language models and diffusion models."
authors = [
    "Yujun Lin",
    "Muyang Li",
    "Shang Yang",
    "Zhekai Zhang",
    "Haotian Tang",
    "Song Han",
    "Chuang Chen",
]
packages = [{ include = "deepcompressor" }]
license = "Apache-2.0"
readme = "README.md"

[tool.poetry.dependencies]
python = ">= 3.12 < 4.0"
tqdm = "== 4.67.3"
torch = "== 2.9.0"
torchvision = "== 0.24.0"
torchmetrics = "== 1.9.0"
ninja = "== 1.13.0"
bitsandbytes = "== 0.49.2"
transformers = "== 4.57.6"
lm_eval = ">= 0.4.2"
accelerate = "== 1.13.0"
datasets = "== 3.6.0"
sentencepiece = "== 0.2.1"
omniconfig = "== 0.1.10"
jieba = "== 0.42.1"
fuzzywuzzy = "== 0.18.0"
rouge = "== 1.0.1"
python-Levenshtein = "==0.27.3"
protobuf = "== 7.35.0"
diffusers = "== 0.37.0"
clean-fid = "== 0.1.35"
dominate = "== 2.9.1"
opencv-python = "== 4.13.0.92"
einops = "== 0.8.2"
timm = "== 1.0.27"
rotary-embedding-torch = "== 0.8.9"
bs4 = "== 0.0.2"
ftfy = "== 6.3.1"
cd-fvd = "== 0.1.1"
xformers = "== 0.0.33.post1"

[tool.poetry.group.dev.dependencies]
matplotlib = ">= 3.8.4"
ipython = ">= 8.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py312"

[tool.ruff.lint]
select = ["B", "C", "E", "F", "I", "W"]
ignore = []

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
